<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash and Delish | Nigerian Delicacies & More</title>
    <style>
        /* CSS Global Design System Variables */
        :root {
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --secondary: #ffedd5;
            --secondary-text: #9a3412;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
            --blue-bg: #eff6ff;
            --blue-border: #bfdbfe;
            --blue-text: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light);
            color: #374151;
            line-height: 1.5;
        }

        /* Sticky Navbar Layout - Fixed Typos */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center; /* Fixed property bug */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .cart-pill {
            background-color: var(--secondary);
            color: var(--secondary-text);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 700;
        }

        /* Native Nigerian Delicacies Hero Background Banner - Fixed Links */
        header {
            height: 50vh;
            /* Instant amber-mahogany brand gradient that loads without internet images */
            background: radial-gradient(circle at 30% 20%, #4a2306 0%, #170a01 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            color: #ffffff;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        header p {
            color: var(--secondary);
            max-width: 600px;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .cta-btn {
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(234, 88, 12, 0.3);
            transition: background 0.2s;
        }

        .cta-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation Interface Layout -->
    <nav>
        <div class="logo">Dash & Delish</div>
        <div class="nav-links">
            <a href="#menu">Our Menu</a>
            <a href="#checkout">Place Order</a>
            <div class="cart-pill">🛒 Cart: <span id="cart-counter">₦0</span></div>
        </div>
    </nav>

    <!-- Native Nigerian Foods Header Backdrop Image banner container -->
    <header>
        <h1>Authentic Nigerian Delicacies</h1>
        <p>Freshly grilled barbecue, warm bakery items, local rich native dishes, and ice-cold refreshments delivered instantly to your door.</p>
        <a href="#menu" class="cta-btn">Explore Menu</a>
    </header>

</body>
</html>
